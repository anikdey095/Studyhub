services:
  - type: web
    name: studyhub-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DB_HOST
        fromDatabase:
          name: studyhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studyhub-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: studyhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: studyhub-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: studyhub-db
          property: database
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: studyhub-frontend
    env: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: studyhub-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: studyhub-db
    databaseName: studyhub
    plan: free
