services:
  - type: web
    name: studyhub-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: studyhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: studyhub-frontend
    env: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: studyhub-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: studyhub-db
    databaseName: studyhub
    plan: free
